<template>
    <footer class="b2b-footer" data-variant={variant}>
        <div class="b2b-footer__container">
            <template lwc:if={ui_isCompact}>
                <div class="b2b-footer__compact">
                    <div class="b2b-footer__compact-left">{salesOrgName}</div>
                    <div class="b2b-footer__compact-center">© 2026 Porcelanosa Grupo. All rights reserved.</div>
                    <div class="b2b-footer__compact-right">
                        <img
                            src={grupoLogoUrl}
                            alt="Porcelanosa Grupo"
                            class="b2b-footer__compact-logo"
                        />
                    </div>
                </div>
            </template>
            <template lwc:if={ui_isFull}>
                <!-- LEFT COLUMN -->
                <div class="b2b-footer__left">
                    <div class="b2b-footer__org">
                        {salesOrgName}
                    </div>
                    <div class="b2b-footer__address">
                        {salesOrgAddress}
                    </div>
                    <div class="b2b-footer__contact">
                        <template lwc:if={salesOrgPhone}>
                            <a class="b2b-footer__contact-link" href={salesOrgPhoneHref}>{salesOrgPhone}</a>
                        </template>
                        <template lwc:if={salesOrgEmail}>
                            <a class="b2b-footer__contact-link" href={salesOrgEmailHref}>{salesOrgEmail}</a>
                        </template>
                    </div>
                </div>

                <!-- CENTER COLUMN -->
                <div class="b2b-footer__center">
                    <img
                        src={royalWarrantUrl}
                        alt="Royal Warrant"
                        class="b2b-footer__royal"
                    />
                    <div class="b2b-footer__copyright">
                        © 2026 Porcelanosa Grupo. All rights reserved.
                    </div>
                </div>

                <!-- RIGHT COLUMN -->
                <div class="b2b-footer__right">
                    <img
                        src={grupoLogoUrl}
                        alt="Porcelanosa Grupo"
                        class="b2b-footer__logo"
                    />
                    <div class="b2b-footer__social">
                        <!-- Facebook -->
                        <a href="https://www.facebook.com/PorcelanosaGrupo" target="_blank" aria-label="Facebook">
                            <!-- Facebook SVG -->
                            <svg class="footer-social-icon" viewBox="0 0 24 24">
                                <path fill="currentColor"
                                    d="M13.5 9H16l-.5 3h-2v9h-4v-9H8V9h1.5V7.5C9.5 5.6 10.6 4 13.1 4H16v3h-1.8c-.7 0-.7.3-.7.8V9Z"/>
                            </svg>
                        </a>

                        <!-- Instagram -->
                        <a href="https://www.instagram.com/porcelanosa" target="_blank" aria-label="Instagram">
                            <svg class="footer-social-icon" viewBox="0 0 24 24" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    fill="currentColor"
                                    d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9Zm4.5 4a4 4 0 1 1 0 8a4 4 0 0 1 0-8Zm0 2a2 2 0 1 0 0 4a2 2 0 0 0 0-4Zm4.75-2.25a1 1 0 1 1 0 2a1 1 0 0 1 0-2Z"
                                />
                            </svg>                    
                        </a>

                        <!-- Pinterest -->
                        <a href="https://www.pinterest.com/porcelanosa" target="_blank" aria-label="Pinterest">
                            <svg
                                class="footer-social-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    fill="currentColor"
                                    d="M12 2a10 10 0 0 0-3.6 19.34c-.05-.82-.1-2.08.02-2.98l1.18-5.02s-.3-.6-.3-1.48c0-1.38.8-2.42 1.8-2.42c.85 0 1.26.64 1.26 1.4c0 .85-.54 2.12-.82 3.3c-.23.98.5 1.78 1.47 1.78c1.76 0 3.12-1.86 3.12-4.55c0-2.38-1.71-4.04-4.16-4.04c-2.83 0-4.5 2.12-4.5 4.32c0 .86.33 1.78.74 2.28a.3.3 0 0 1 .07.29l-.28 1.1c-.04.18-.14.22-.32.13c-1.18-.55-1.92-2.28-1.92-3.67c0-2.99 2.17-5.74 6.27-5.74c3.29 0 5.85 2.34 5.85 5.46c0 3.26-2.05 5.88-4.9 5.88c-.96 0-1.86-.5-2.17-1.1l-.59 2.24c-.21.82-.79 1.85-1.17 2.48A10 10 0 1 0 12 2Z"
                                />
                            </svg>
                        </a>

                        <!-- Vimeo -->
                        <a href="https://vimeo.com/porcelanosa" target="_blank" aria-label="Vimeo">
                           <svg
                                class="footer-social-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    fill="currentColor"
                                    d="M22.23 7.33c-.09 2.1-1.56 4.97-4.4 8.6c-2.94 3.82-5.42 5.73-7.44 5.73c-1.25 0-2.31-1.16-3.18-3.49L5.36 11.2c-.58-2.1-1.2-3.15-1.85-3.15c-.14 0-.64.3-1.51.9L1 7.77c1.6-1.41 3.18-2.82 4.73-4.23c1.46-1.27 2.56-1.94 3.3-2c1.73-.17 2.8 1.02 3.21 3.57c.45 2.76.76 4.47.94 5.13c.52 2.34 1.09 3.51 1.71 3.51c.48 0 1.2-.76 2.17-2.27c.97-1.51 1.49-2.66 1.57-3.44c.14-1.3-.38-1.95-1.57-1.95c-.56 0-1.13.13-1.71.39c1.14-3.7 3.32-5.5 6.54-5.39c2.38.06 3.5 1.57 3.38 4.54Z"
                                />
                            </svg>
                        </a>

                        <!-- LinkedIn -->
                        <a href="https://www.linkedin.com/company/porcelanosa" target="_blank" aria-label="LinkedIn">
                            <svg class="footer-social-icon" viewBox="0 0 24 24">
                                <path fill="currentColor"
                                    d="M4.98 3.5a2.49 2.49 0 1 1 0 4.98 2.49 2.49 0 0 1 0-4.98ZM3 21h4V9H3v12Zm7-12h3.8v1.64h.05c.53-.99 1.83-2.04 3.76-2.04 4.02 0 4.77 2.65 4.77 6.1V21h-4v-5.42c0-1.29-.03-2.95-1.8-2.95-1.8 0-2.07 1.4-2.07 2.85V21h-4V9Z"/>
                            </svg>
                        </a>

                    </div>

                    <div class="b2b-footer__market">
                        {marketLabel}
                    </div>
                                
                </div>
            </template>
        </div>
        <c-lib-store-context-provider 
            oncontextreceived={handleContextReceived} 
            oncontexterror={handleContextError}>
        </c-lib-store-context-provider>
    </footer>
</template>
