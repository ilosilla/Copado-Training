<template>
    <div class="container">

        <div class="slds-modal__header header">
            <div class="slds-theme_shade slds-text-align_left slds-var-p-around_small">

                <div class="slds-page-header__row">
                
                    <div class="slds-page-header__col-title">
                        <div class="slds-media slds-var-p-around_small">
                            <div class="slds-media__figure">
                                <span class="slds-icon_container">
                                    <lightning-icon icon-name={headerIcon} size="medium" class="header-icon"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-media__body">
                                <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1 class={mainTitleClass}> <!-- class="slds-page-header__title"> -->
                                    <span class="slds-truncate" title={headerTitle}>{headerTitle}</span>
                                    </h1>
                                </div>
                                </div>
                                <p class="slds-page-header__name-meta">{headerSubtitle}</p>
                            </div>
                        </div>
                    </div>

                    <div class="slds-page-header__col-actions">
                        <div class="slds-page-header__controls slds-var-p-around_small">
                            <div class="slds-page-header__control slds-var-m-top_x-small">
                                <slot name="header-actions">
                                </slot> 
                            </div>
                        </div>
                    </div>

                </div>

                <div class="slds-var-p-top_small slds-var-p-horizontal_small slds-border_top" lwc:if={showFormHeader}>
                    <slot name="form-header"></slot>
                </div>                        
            </div>        
        </div>
    
        <div class="content">
            <div class="content-container">

                <div class="main-content">
                    <slot name="main-content"></slot>
                </div>

                <div class="side-bar" lwc:if={showSidePanel}>
                    <div class="slds-panel slds-panel_docked slds-panel_docked-right slds-is-open">
                        <slot name="side-panel">
                            <div class="slds-panel__header">
                                <lightning-icon icon-name={sidePanelIcon} class="slds-panel__back"></lightning-icon>
                                <h2 class="slds-panel__header-title slds-text-heading_small slds-truncate" title="Panel Header">{sidePanelTitle}</h2>
                                <div class="slds-panel__header-actions" lwc:if={showClosePanelButton}>
                                    <lightning-button-icon variant="bare" icon-name="utility:close" onclick={handleCloseDetailClick} title="Close Details"></lightning-button-icon>
                                </div>
                            </div>                    
                            <div class="slds-panel__body slds-var-p-top_xxx-small">
                                <slot name="side-panel-body"></slot>
                            </div>
                        </slot>
                    </div>
                </div>            
            </div>
        </div>

        <lightning-modal-footer class="footer">
            <slot name="footer">
                <lightning-layout>
                    <lightning-layout-item size="6">
                        <slot name="footer-left" class="footer-left slds-text-align_left">
                        </slot>
                    </lightning-layout-item>
                    <lightning-layout-item size="6" class="footer-right">
                        <slot name="footer-right">                            
                            <lightning-button label={labels.dict_button_cancel} onclick={handleCancel} disabled={disableCancelButton}></lightning-button>
                            <lightning-button variant="brand" label={labels.dict_button_ok} onclick={handleOkay} disabled={disableOkButton}></lightning-button>
                        </slot>
                    </lightning-layout-item>
            </lightning-layout>
            </slot>
        </lightning-modal-footer>

        <lightning-spinner lwc:if={showSpinner}></lightning-spinner>

    </div>
</template>
