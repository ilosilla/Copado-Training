<template>
    <template if:true={events}>
        <table class="slds-table slds-table_cell-buffer" aria-label="Example default base table of Opportunities">
            <thead>
              <tr class="slds-line-height_reset">
                <th class="slds-size--1-of-12" scope="col">
                    <div class="slds-truncate" title="Completed">{label.labelCompleted}</div>
                </th>
                <th class="slds-size--4-of-12" scope="col">
                    <div class="slds-truncate" title="Date">{label.labelSubject}</div>
                </th>
                <th class="slds-size--2-of-12" scope="col">
                  <div class="slds-truncate" title="Date">{label.labelDate}</div>
                </th>
                <th class="slds-size--1-of-12" scope="col">
                  <div class="slds-truncate" title="Cancelled">{label.labelCancelled}</div>
                </th>
                <th class="sslds-size--3-of-12" scope="col">
                    <div class="slds-truncate" title="Comment">Comment</div>
                  </th>
                  <template if:false={isreadonly}>
                    <th class="slds-size--1-of-12 slds-cell_action-mode" scope="col" style="width:3.25rem">
                        <div class="slds-truncate slds-assistive-text" title="Actions">Actions</div>
                    </th>
                  </template>
              </tr>
            </thead>
            <tbody>
                <template for:each={events} for:item="event">
                    <tr class="slds-hint-parent" key={event.Id}>
                        <th data-label="Comment" class="slds-align--absolute-center">
                            <div class="slds-truncate" title="Event">
                                <template if:true={event.LoginFlowCompleted__c}>
                                    <lightning-icon icon-name='utility:switch' alternative-text='switch' size='xx-small' title='switch'></lightning-icon>
                                  </template>
                            </div>
                        </th>
                        <td data-label="Subject" scope="row">
                            <div class="slds-truncate" title="Date">
                                <template if:true={completed}>
                                    <a href={event.eventLink} target="_blank" >{event.Subject}</a>
                                </template>
                                <template if:false={completed}>
                                    {event.Subject}
                                </template>
                            </div>
                        </td>
                        <td data-label="Date">
                            <lightning-formatted-date-time 
                                value={event.StartDateTime}
                                year="numeric"
                                month="short"
                                day="2-digit"
                                hour="2-digit"
                                minute="2-digit">
                            </lightning-formatted-date-time>
                        </td>
                        <td data-label="Cancelled">
                          <div class="slds-truncate" title="Cancelled">
                            <template if:true={event.Cancelled__c}>
                                <lightning-icon icon-name='utility:switch' alternative-text='switch' size='xx-small' title='switch'></lightning-icon>
                              </template>
                          </div>
                        </td>
                        <td data-label="Subject" scope="row">
                            <div class="slds-truncate max-width:200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="Date">
                                {event.Description}
                            </div>
                          </td>
                          <template if:false={isreadonly}>
                            <td data-label="Actions">
                                <lightning-button-menu alternative-text="Show menu">
                                    <lightning-menu-item value={label.labelEdit} label={label.labelEdit} onclick={handleRowAction} data-id={event.Id}></lightning-menu-item>
                                </lightning-button-menu>
                            </td>
                          </template>

                    </tr>
                </template>
            </tbody>
          </table>
    </template>

    <template if:true={isModalOpen}>
        <div class="slds-backdrop slds-backdrop_open"></div>
        <!-- Modal -->
    <section role="dialog" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            
            <!-- Header con "X" -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Cerrar"
                        onclick={handleCloseModal}>
                    <lightning-icon icon-name="utility:close" size="small" alternative-text="Cerrar"></lightning-icon>
                </button>
                <h2 class="slds-text-heading_medium">{label.labelEditEvent}</h2>
            </header>

            <!-- Contenido -->
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-flow
                    flow-api-name="Edit_Event_Flow"
                    flow-input-variables={inputVariables}
                    onstatuschange={handleFlowStatusChange}>
                </lightning-flow>
            </div>
        </div>
    </section>
        
    </template>
</template>
