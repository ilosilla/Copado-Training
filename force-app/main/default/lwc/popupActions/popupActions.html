<template>
    <template lwc:if={showList}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog"
                tabindex="-1"
                aria-labelledby="modal-heading-02"
                aria-modal="true"
                aria-describedby="modal-content-id-2"
                class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="width: 60% !important;max-width: 40% !important;">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <template lwc:if={canBeClosed}>
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close"
                                alternative-text="close"
                                variant="inverse"
                                size="small" ></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                    </template>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{titlePopup}</h2>
                    <h5 class="slds-hyphenate">{subtitlePopup}</h5>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                    <template lwc:if={showComponentDvsUnmanaged}>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered" aria-labelledby="element-with-table-label other-element-with-table-label">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <template for:each={columnsDvsUnmanaged} for:item="column">
                                        <th key={column.Label} class="slds-text-align--center" scope="col">
                                            <div class="slds-truncate" title="Account Name">{column.label}</div>
                                        </th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <template lwc:if={notEmptyAccountList}>
                                    <template for:each={noManagedAccounts} for:item="acc">
                                        <tr key={acc.Id}>
                                            <td>
                                                <lightning-formatted-url value={acc.recordLink} tooltip="Omit leading slash" target="_blank" label={acc.Name}></lightning-formatted-url>
                                            </td>
                                            <td>
                                                <div class="slds-truncate slds-text-align--center" title="Account Name">{acc.managed}</div>
                                            </td>
                                        </tr>
                                    </template>
                                </template>
                            </tbody>
                        </table>
                        <br/>
                        <lightning-formatted-url value="/lightning/o/Account/list?filterName=dvs_unmanaged_accounts_fr" label={label.seeAllLabel}></lightning-formatted-url>
                    </template>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
