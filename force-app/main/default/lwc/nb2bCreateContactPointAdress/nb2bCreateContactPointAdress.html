<template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container" style="width: 100%;margin:0">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                    <lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small" ></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Contact Point Address</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <lightning-record-edit-form class object-api-name="ContactPointAddress" onsuccess={handleSuccess} onsubmit={handleSave} onerror={handleError}>                    
                    <div class="slds-m-left_xx-large slds-m-right_xx-large">
                        <lightning-input-field field-name="Name" required></lightning-input-field>
                        <lightning-input-field field-name="ParentId" value={accountId} disabled></lightning-input-field>
                        <lightning-input-field field-name="IsDefault"></lightning-input-field>
                        <lightning-input-address
                            address-label="Address"
                            street-label="Street"
                            city-label="City"
                            country-label="Country"
                            province-label="State/ Province"
                            postal-code-label="Zip/ Postal Code"
                            onchange={addressInputChange}
                            required
                            show-address-lookup>
                        </lightning-input-address>
                    </div>
                    <div class="slds-align_absolute-center slds-m-top_x-large">
                        <lightning-button class="slds-m-bottom_small slds-m-right_medium" label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button class="slds-m-bottom_small" label="Save" variant="brand" type="submit"></lightning-button>
                    </div>
                </lightning-record-edit-form>
            </div>
        </div>
    </section>
    <template if:true={showModalToCreateAddress}>
        <c-nb2b-create-contact-point-adress></c-nb2b-create-contact-point-adress>
    </template>
</template>
