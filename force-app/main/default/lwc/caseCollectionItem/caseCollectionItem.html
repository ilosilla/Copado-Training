<template>
    <c-lib-panel
        show-panel={showDialog}
        dock="right"
        width="500px"
        border="true"
        shade="false"
        modal="true"
        title={labels.tr0009_148}
        icon="standard:webcart"
        css-container-class="slds-var-p-around_medium">

        <div slot="body" class="slds-var-p-around_medium slds-var-m-right_medium">

            <div class="slds-grid slds-wrap slds-gutters slds-theme_shade">
                <div class="slds-col slds-size_2-of-2">
                    <b><lightning-input label={labels.dict_product} read-only="true" value={productString}> </lightning-input></b>    
                </div>
                <div class="slds-col slds-size_2-of-4">
                    <b><lightning-input label={labels.dict_invoiced} value={currentItem.invString} read-only></lightning-input></b>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <b><lightning-input label={labels.dict_pcs_box} value={currentItem.pcsxbox} read-only></lightning-input></b>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <b><lightning-input label={labels.dict_mt2_box} value={currentItem.mt2xbox} read-only></lightning-input></b>
                </div>
            </div>
        
            <div lwc:if={currentItem.lineOK}>
                <div class="slds-var-m-top_small slds-var-p-bottom_small slds-var-p-top_xx-small slds-border_top slds-border_bottom">
                    <lightning-radio-group name="radioGroup"
                        label={labels.tr0009_149}
                        disabled={disableConversions}
                        options={displayUnits}
                        value={selectedUnit}
                        type="button"
                        onchange={handleDisplayUnitChange}>
                    </lightning-radio-group>
                </div>

                <c-lib-error-panel errors={error} theme='error' hide-close-button=true></c-lib-error-panel>
                
                <!-- *************************** INVOICE UNITS *************************** -->
                <div lwc:if={useInvoiceUnits}>
                    <div class="slds-grid slds-gutters slds-wrap slds-var-p-vertical_large slds-border_bottom">                
                        <div class="slds-col slds-size_2-of-5">
                            <span class="slds-form-element__label">{labels.dict_quantity_invoiced}</span>
                        </div>                
                        <div class="slds-col slds-size_2-of-5">
                            <lightning-input disabled="true" value={currentItem.invoiced} variant="label-hidden"> </lightning-input>                            
                        </div>
                        <div class="slds-col slds-size_1-of-5">
                            <lightning-input read-only="true" value={currentItem.unitLabel} variant="label-hidden"> </lightning-input>                            
                        </div>    
                        <div class="slds-col slds-size_2-of-5 slds-var-p-top_x-small">
                            <span class="slds-form-element__label">{labels.tr0009_151}</span> <!-- Quantity to Collect -->
                        </div>
                        <div class="slds-col slds-size_2-of-5 slds-var-p-top_x-small">
                            <lightning-input data-id="colUnits" disabled={readOnly} value={currentItem.collected} variant="label-hidden" onblur={handleQuantityChange}> </lightning-input>
                        </div> 
                        <div class="slds-col slds-size_1-of-5 slds-var-p-top_x-small">
                            <lightning-input read-only="true" value={currentItem.unitLabel} variant="label-hidden"> </lightning-input>                            
                        </div>
                        <div class="slds-col slds-size_2-of-5 slds-var-p-top_x-small">
                            <span class="slds-form-element__label">{labels.tr0009_152}</span> <!-- Quantity Stocked -->
                        </div>
                        <div class="slds-col slds-size_2-of-5 slds-var-p-top_x-small">
                            <lightning-input data-id="stocked" disabled="true" value={currentItem.confirmed} variant="label-hidden"> </lightning-input>
                        </div> 
                        <div class="slds-col slds-size_1-of-5 slds-var-p-top_x-small">
                            <lightning-input read-only="true" value={currentItem.confUnit} variant="label-hidden"> </lightning-input>                            
                        </div>    
                    </div>
                </div>

                <div lwc:else>
                    <div class="slds-grid slds-gutters slds-wrap slds-var-p-vertical_large slds-border_bottom">                
                        <div class="slds-col slds-size_2-of-4">
                            <span class="slds-form-element__label">{labels.dict_quantity_invoiced}</span> <!-- Quantity invoiced (Box/Pcs) -->
                        </div>                
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-input disabled="true" value={currentItem.invBoxes} variant="label-hidden"> </lightning-input>                            
                        </div>
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-input disabled="true" value={currentItem.invPieces} variant="label-hidden"> </lightning-input>                            
                        </div>    

                        <div class="slds-col slds-size_2-of-4 slds-var-p-top_x-small">
                            <span class="slds-form-element__label">{labels.tr0009_151}</span> <!-- Quantity to collect (Box/Pcs) -->
                        </div>
                        <div class="slds-col slds-size_1-of-4 slds-var-p-top_x-small">
                            <lightning-input data-id="colBoxes" disabled={readOnly} value={currentItem.colBoxes} variant="label-hidden" onblur={handleQuantityChange}> </lightning-input>
                        </div> 
                        <div class="slds-col slds-size_1-of-4 slds-var-p-top_x-small">
                            <lightning-input data-id="colPieces" disabled={readOnly} value={currentItem.colPieces} variant="label-hidden" onblur={handleQuantityChange}> </lightning-input>                            
                        </div>

                        <div class="slds-col slds-size_2-of-4 slds-var-p-top_x-small">
                            <span class="slds-form-element__label">{labels.tr0009_152}</span> <!-- Quantity stocked (Box/Pcs) -->
                        </div>
                        <div class="slds-col slds-size_1-of-4 slds-var-p-top_x-small">
                            <lightning-input data-id="stocked" disabled="true" value={currentItem.confBoxes} variant="label-hidden"> </lightning-input>
                        </div> 
                        <div class="slds-col slds-size_1-of-4 slds-var-p-top_x-small">
                            <lightning-input disabled="true" value={currentItem.confPieces} variant="label-hidden"> </lightning-input>                            
                        </div>    
                    </div>
                </div>

            </div> <!-- Data section -->

            <div lwc:else>
                <div class="slds-var-m-top_medium slds-var-p-around_large slds-grid slds-wrap slds-gutters slds-theme_error slds-theme_alert-texture">
                    <div class="slds-col slds-size_2-of-2">
                        {labels.tr0009_150} <!-- This line cannot be collected... -->
                    </div>
                </div>    
            </div>

            <div class="slds-grid slds-gutters slds-var-m-top_medium">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-button label={labels.dict_button_cancel} variant="bare" class="slds-m-right--xx-small" onclick={handleCancelClick}></lightning-button>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-text-align_right">
                    <lightning-button-group>
                        <lightning-button-icon icon-name="utility:chevronleft" title={labels.dict_previous_item} disabled={disablePreviousButton} onclick={handlePreviousClick}></lightning-button-icon>    
                        <lightning-button label={labels.dict_button_ok} variant="brand" onclick={handleOKClick} disabled={isNotOK}></lightning-button>
                        <lightning-button-icon icon-name="utility:chevronright" title={labels.dict_next_item} disabled={disableNextButton} onclick={handleNextClick}></lightning-button-icon>
                    </lightning-button-group>
                </div>
            </div>

        </div>
                
    </c-lib-panel>
</template>
