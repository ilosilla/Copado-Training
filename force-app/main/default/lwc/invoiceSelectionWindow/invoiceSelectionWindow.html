    <div class="sideBar slds-float_left">
        <div class="slds-split-view_container slds-is-open">    
            <div aria-hidden="false" id="split-view-id" class="slds-split-view slds-grid slds-grid_vertical slds-grow slds-scrollable">                    
                <header class="slds-split-view__header">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                        <div class="slds-has-flexi-truncate">
                            <div class="slds-media slds-media_center">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:case"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <h1 class="slds-page-header__title slds-text-color_default slds-p-right_x-small slds-p-bottom_xxx-small">Open a Claim</h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>

                <div class="slds-grow slds-has-flexi-truncate">
                    <div class="slds-col slds-size_2-of-2">
                        <p class="slds-text-body_small slds-text-color_weak">Please select an invoice to start the process</p>
                    </div>
                    <div class="slds-grid slds-grid_vertical slds-scrollable">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input
                            data-id="invoiceNumber"
                            type="search"
                            autocomplete = "on"
                            max-length = "10"
                            label="SAP Invoice"
                            data-name="sapInvoice"
                            value={invoiceNumber}
                            is-loading={isLoading}
                            required="false"
                            onchange={handleInvoiceChange}
                            onkeypress={handleEnter}
                        ></lightning-input>
    
                        </div>
    
                    </div>
                    <div class="slds-split-view__list-header docs-header">
                        <div class="slds-split-view__list-item-action slds-grow slds-has-flexi-truncate">
                            <div class="slds-grid slds-wrap">
                                <span id="hNumber" class="slds-truncate clickable-header" title="Label.c.dict_docNumber" onclick={changeOrder}>Esto es algo</span>
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap">
                            Esto debería ser el grid
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
