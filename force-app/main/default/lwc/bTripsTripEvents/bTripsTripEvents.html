<template>
    <lightning-layout multiple-rows >
        <lightning-layout-item size="12" flexibility="auto" padding="horizontal-small" class="slds-text-align_right">
            <lightning-button-group>
                <lightning-button label="Nuevo Evento" title="Download action" icon-name="utility:add" onclick={handleNewEvent} class="slds-m-left_x-small"></lightning-button>
            </lightning-button-group>
        </lightning-layout-item>
    </lightning-layout>

    <br/>

    <table class="slds-table slds-table_cell-buffer slds-table--striped">
        <thead>
          <tr class="slds-line-height_reset">
            <th class="slds-size--4-of-12" scope="col">
                <div class="slds-truncate" title="Completed">Título</div>
              </th>
            <th class="slds-size--2-of-12" scope="col">
               <div class="slds-truncate" title="Close Date">Visita Relacionada</div>
              </th>
            <th class="slds-size--1-of-12" scope="col">
                <div class="slds-truncate" title="Completed">Fecha</div>
              </th>             
            <th class="slds-size--4-of-12" scope="col">
              <div class="slds-truncate" title="Opportunity Name">Propuesta</div>
            </th>
            <th class="slds-size--1-of-12" scope="col">
                <div class="slds-truncate" title="Close Date">Tipo Evento</div>
              </th>
            <th class="slds-size--1-of-12" scope="col">
                <div class="slds-truncate" title="Close Date">Status</div>
              </th>
           
            <th class="slds-cell_action-mode slds-size--1-of-12" scope="col" style="width:3.25rem">
                <div class="slds-truncate slds-assistive-text" title="Actions">Actions</div>
              </th>
          </tr>
        </thead>
        <tbody>
            <template for:each={events} for:item="event">
                <tr class="slds-hint-parent" key={event.Id}>                    
                    <td data-label="Comment">
                        <div class="slds-truncate" title="Name">
                            {event.Title__c}
                        </div>
                    </td>
                    <td data-label="Comment">
                        <div class="slds-truncate" title="Visit">
                            {event.Business_Trip_Visit__r.Title__c}
                          </div>
                    </td>
                    <th data-label="Account Name" scope="row">
                        <lightning-formatted-date-time
                            value={event.Date__c}
                            year="numeric"
                            month="short"
                            day="2-digit">
                        </lightning-formatted-date-time>
                    </th>                   
                    <td data-label="Comment">
                        <div class="slds-truncate" title="Name">
                            {event.Comment__c}
                        </div>
                    </td>
                    <td data-label="Comment">
                        <div class="slds-truncate" title="Event Type">
                            {event.Event_Type__c }
                          </div>
                    </td>
                    <td data-label="Comment">
                        <div class="slds-truncate" title="Event Type">
                            {event.Status__c }
                          </div>
                    </td>                  
                      <td data-label="Comment">
                        <lightning-button-menu alternative-text="Show menu">
                            <lightning-menu-item value="EDIT" label="Editar" onclick={handleRowActionEdit} data-id={event.Id}></lightning-menu-item>
                            <lightning-menu-item value="VIEW" label="Ver" onclick={handleRowActionShow} data-id={event.Id}></lightning-menu-item>
                            <lightning-menu-item value="DELETE" label="Eliminar" onclick={handleRowActionDelete} data-id={event.Id}></lightning-menu-item>
                        </lightning-button-menu>
                    </td>
                </tr>
            </template>
        </tbody>
      </table>


    <template if:true={isModalOpenCreateEvent}>
        <div class="slds-backdrop slds-backdrop_open">
            <!-- Modal -->
            <section role="dialog" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    
                    <!-- Header con "X" -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Cerrar"
                                onclick={handleCloseModal}>
                            <lightning-icon icon-name="utility:close" size="small" alternative-text="Cerrar"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Creación Evento</h2>
                    </header>

                    <!-- Contenido -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-flow
                            flow-api-name="Business_trip_Event"
                            flow-input-variables={inputVariables}
                            onstatuschange={handleFlowStatusChange}>
                        </lightning-flow>
                    </div>
                </div>
            </section>
        </div>
    </template>

    <template if:true={isModalOpenDeleteEvent}>
        <div class="slds-backdrop slds-backdrop_open">
        <!-- Modal -->
            <section role="dialog" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    
                    <!-- Header con "X" -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Cerrar"
                                onclick={handleCloseModal}>
                            <lightning-icon icon-name="utility:close" size="small" alternative-text="Cerrar"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Eliminar Evento</h2>
                    </header>

                    <!-- Contenido -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-flow
                            flow-api-name="Delete_Business_Trip_Event"
                            flow-input-variables={inputVariables}
                            onstatuschange={handleFlowStatusChange}>
                        </lightning-flow>
                    </div>
                </div>
            </section>
        </div>
    </template>


    <template if:true={isModalOpenShowEvent}>
        <div class="slds-backdrop slds-backdrop_open">
        <!-- Modal -->
            <section role="dialog" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    
                    <!-- Header con "X" -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Cerrar"
                                onclick={handleCloseModal}>
                            <lightning-icon icon-name="utility:close" size="small" alternative-text="Cerrar"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Evento</h2>
                    </header>

                    <!-- Contenido -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-record-view-form
                            object-api-name="BusinessTripEvent__c"
                            record-id={selectedEvent}
                        >
                        <lightning-output-field field-name="Title__c"> </lightning-output-field>
                        <lightning-output-field field-name="Date__c"> </lightning-output-field> 
                        <lightning-output-field field-name="Event_Type__c"> </lightning-output-field>                       
                        <lightning-output-field field-name="Comment__c"> </lightning-output-field>                          
                        <lightning-output-field field-name="Status__c"> </lightning-output-field> 
                        <lightning-output-field field-name="Agreement__c"> </lightning-output-field>                                                                   
                    </lightning-record-view-form>
                    </div>
                </div>
            </section>
        </div>
    </template>
</template>
