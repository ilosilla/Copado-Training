<!-- sldsValidatorIgnore -->
<template>
    <div class={baseClassName} data-id={id}>
        <!--section header-->
        <h3 class={headerClass} lwc:if={fixed}>
            <span class="slds-truncate slds-var-p-horizontal_small" title={label}>{label}</span>
        </h3> 
        <h3 class={headerClass} lwc:else>
            <button type="button" aria-controls={id} class="slds-button slds-section__title-action transparent-background" data-buttonid={id} onclick={toggleSection}>
                <lightning-icon icon-name="utility:switch" alternative-text="button icon" size="x-small"
                    class="slds-section__title-action-icon slds-button__icon_left"></lightning-icon>
                <span class="slds-truncate" title={label}>{label}</span>
            </button>
        </h3>
        <!--section body-->
        <div class="slds-section__content">
            <slot></slot>
        </div>
    </div>
</template>
