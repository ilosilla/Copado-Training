<template>
    <template lwc:if={showSpinner}>
        <lightning-spinner variant="brand" size="medium"> </lightning-spinner>
    </template>
    <div style="width:100%;min-height:100%; height:100%;">
        <div class="slds-card slds-box" style="margin: 0 auto; width:50%; min-height:100%; height:100%; padding:0 6px;">
            <div  class="slds-p-horizontal_medium slds-size_full"  style="overflow-y:auto">
                <h2 class="slds-text-heading_medium slds-m-top_large slds-p-bottom_medium slds-p-horizontal_medium slds-border_bottom">{label.newCaseLabel}</h2> 
                <div class="slds-var-p-around_large" lwc:if={noPermissions}>
                    <span>{label.caseNoPermission}</span>
                </div>               
                <div class="slds-p-around_medium" lwc:else>    
                    <lightning-radio-group 
                        lwc:ref="radioGroup"
                        label={label.caseSelectionPrompt}
                        options={caseOptions}
                        value={defaultOption}
                        type="radio">
                    </lightning-radio-group>      
                </div>
                <div class="slds-p-around_medium slds-p-top_large slds-border_top" style="text-align:center; width: 100%;">                        
                    <lightning-button label={label.cancelButtonLabel}  onclick={handleCancelClick}></lightning-button>
                    <lightning-button variant="brand" label={label.nextButtonLabel} onclick={handleNextClick} disabled={noPermissions} class="slds-var-m-left_xx-small"></lightning-button>
                </div>

            </div>
        </div>
    </div>
</template>
